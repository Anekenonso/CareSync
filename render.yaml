services:
  - type: web
    name: caresync-agent
    env: docker
    dockerfilePath: ./Dockerfile
    plan: free
    region: oregon
    healthCheckPath: /health
    autoDeploy: true
    envVars:
      - key: PORT
        value: 8000
      - key: SAMPLE_MODE
        value: "true"
      - key: LOG_LEVEL
        value: INFO
