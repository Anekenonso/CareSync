<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" fill="none">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#00D287" />
      <stop offset="50%" stop-color="#10B981" />
      <stop offset="100%" stop-color="#059669" />
    </linearGradient>
    <linearGradient id="pulseGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#FFFFFF" />
      <stop offset="100%" stop-color="#F0FDF4" />
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="2" stdDeviation="2" flood-color="#064E3B" flood-opacity="0.35"/>
    </filter>
  </defs>
  
  <!-- Rounded Shield Base -->
  <rect x="4" y="4" width="56" height="56" rx="16" fill="url(#bgGrad)" filter="url(#glow)"/>
  
  <!-- Subtle Internal Border -->
  <rect x="5.5" y="5.5" width="53" height="53" rx="14.5" stroke="#86EFAC" stroke-width="1.5" stroke-opacity="0.6"/>

  <!-- Synchronized Pulse + Heartline Path -->
  <path d="M14 34 H22 L26 23 L32 43 L37 27 L41 35 L44 32 H50" 
        stroke="url(#pulseGrad)" 
        stroke-width="4.5" 
        stroke-linecap="round" 
        stroke-linejoin="round"/>
        
  <!-- Floating Health Sparkle -->
  <circle cx="45" cy="18" r="3.5" fill="#FFFFFF"/>
</svg>
